routes:
  - name: explicit-target
    when:
      has_target: true
    use_target_from_input: true

  - name: github-pr-code-review
    when:
      source: github
      event_in:
        - pull_request.opened
        - pull_request.synchronize
        - pull_request.ready_for_review
    target:
      type: workflow
      id: code-review
