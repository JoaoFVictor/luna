type: router
version: "2026-06"
rules:
  - id: explicit_target
    when:
      expression: "$exists($.invocation.target)"
    target: $.invocation.target

  - id: github_pr_code_review
    when:
      expression: "$.invocation.source = 'github' and $.invocation.event = 'pull_request' and $.invocation.action in ['selected', 'opened', 'synchronize', 'reopened']"
    target: workflow:code-review

  - id: jira_issue_implementation
    when:
      expression: "$.invocation.source = 'jira' and $.invocation.event = 'issue' and $.invocation.action = 'selected'"
    target: workflow:implementation

  - id: plane_issue_implementation
    when:
      expression: "$.invocation.source = 'plane' and $.invocation.event = 'issue' and $.invocation.action = 'selected'"
    target: workflow:implementation
