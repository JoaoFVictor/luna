model_profiles:
  default:
    model: ${DEFAULT_MODEL:-openai/gpt-5-mini}
    reasoning_effort: medium
  deep:
    model: ${DEEP_MODEL:-openai/gpt-5}
    reasoning_effort: high
  fast:
    model: ${FAST_MODEL:-openai/gpt-5-mini}
    reasoning_effort: low
  balanced:
    model: ${BALANCED_MODEL:-openai/gpt-5-mini}
    reasoning_effort: medium
