version: "2026-06"
server:
  host: "127.0.0.1"
  port: 4012
  body_limit_bytes: 1048576
queue:
  name: "luna-webhooks"
  redis_url: "redis://127.0.0.1:6379"
  # MVP dedupe uses deterministic BullMQ job ids. This TTL is reserved for a
  # future explicit BullMQ deduplication mode and is not operative yet.
  dedupe_ttl_seconds: 604800
  remove_on_complete:
    age_seconds: 86400
    count: 1000
  remove_on_fail: false
worker:
  concurrency: 8
providers:
  github:
    enabled: true
    secret_ref: "providers.webhooks.github.secret"
  plane:
    enabled: true
    secret_ref: "providers.webhooks.plane.secret"
    config:
      # Plane sends all work item changes when the Work items event is enabled.
      # Keep implementation runs gated to explicit development-ready states.
      issue_state_allowlist:
        - "In Progress"
