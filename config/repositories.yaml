repositories:
  # Example repository entry. Replace this with the repositories Luna may read
  # or edit. In Docker Compose, repository paths should be container paths under
  # /repositories; the host parent is mounted with LUNA_REPOSITORIES_ROOT.
  - id: example-repo
    # Source provider id used by invocation repository matching.
    provider: github
    # Provider repository owner/organization.
    owner: example-org
    # Provider repository name.
    name: example-repo
    # Local clone path. Compose mounts LUNA_REPOSITORIES_ROOT at /repositories.
    path: /repositories/example-repo
    # Git remote name used for repository operations.
    remote: origin
    # Allowed remote URLs for trusted write workflows.
    expected_remote_urls:
      - git@github.com:example-org/example-repo.git
      - https://github.com/example-org/example-repo.git
    context:
      # Repository files collected into explicit runtime context when present.
      files:
        - AGENTS.md
        - README.md
    # Optional operator-bound exclusions for the canonical repository index.
    # They apply equally to workflow context and repository-context.query.
    repository_context:
      exclude_globs:
        - generated/**
    # Operator-owned validation policy for this repository. The command is a
    # repository contract; Luna does not infer a language, framework, or tool.
    validation:
      commands:
        - cmd: ./scripts/validate
          timeout_ms: 600000
      # Only named variables are inherited. HOME is supplied as an isolated
      # temporary directory by Luna and never needs to be allowlisted.
      env_allowlist: []
