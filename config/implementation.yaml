implementation:
  branch_pattern: feature/{slug}
  commit:
    enabled: true
  push:
    enabled: true
    remote: origin
  change_request:
    enabled: true
    provider: github
    draft: true
    base_ref: main
  sandbox:
    type: trusted_host_local
    env_allowlist: []
  validation:
    repair_attempts: 1
    max_output_bytes: 200000
    commands: []
