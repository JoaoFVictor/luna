implementation:
  # Branch name template for implementation worktrees.
  branch_pattern: feature/{slug}
  commit:
    # push.enabled and change_request.enabled require commits to be enabled.
    enabled: true
  push:
    # change_request.enabled requires push.enabled.
    enabled: true
    # Git remote used when pushing the implementation branch.
    remote: origin
  change_request:
    # Open a provider change request after a successful push.
    enabled: true
    # Change request provider id.
    provider: github
    # Create the change request as draft.
    draft: true
    # Target base branch/ref for the change request.
    base_ref: main
  sandbox:
    # Current write sandbox type. Only trusted_host_local is supported.
    type: trusted_host_local
  validation:
    # Number of repair attempts after validation or review-gate failures.
    # Validation, technical review, and acceptance all consume the same repair
    # budget. Keep enough attempts for a transient setup failure and subsequent
    # reviewer feedback without publishing a rejected implementation.
    repair_attempts: 5
    # Maximum captured stdout/stderr bytes per validation command.
    max_output_bytes: 200000
  repository_context:
    # Canonical deterministic impact graph shared with code review. The task
    # text seeds relevance; repository indexing owns discovery and coverage.
    enabled: true
    max_related_files: 20
    max_seed_files: 5
    max_excerpt_bytes: 4000
    include_tests: true
    include_docs: true
    include_configs: true
