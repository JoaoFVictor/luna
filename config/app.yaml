workspace:
  # Current workspace strategy. Only git_worktree is supported.
  strategy: git_worktree
  # Directory where Luna creates per-run worktrees.
  root: .runs/workspaces
  # Keep successful run worktrees for inspection.
  preserve_on_success: false
  # Keep failed run worktrees for debugging.
  preserve_on_failure: true
artifacts:
  # Directory where run artifacts are written.
  root: .runs
# Workflow runtime used by the native workflow runner.
workflow_runtime:
  id: langgraph
  options: {}
# Agent runtime used by the native workflow runner.
agent_runtime:
  id: pi
  options:
    # Deep reasoning/tool-call agents can legitimately take several minutes.
    request_timeout_ms: 600000
# Optional lock tuning. If omitted, Luna uses runtime defaults.
# locks:
#   root: .runs/locks
#   timeout_ms: 300000
#   stale_after_ms: 900000
