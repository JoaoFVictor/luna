id: code-review
type: workflow
mode: read_only
input_schema: input.schema.json
output_schema: output.schema.json
capabilities:
  - runtime
  - context
  - agents
  - reports
  - artifacts
requires:
  repository: true
execution:
  max_concurrency: 2
  lock_timeout_ms: 120000
nodes:
  - id: preflight
    type: built_in
    uses: runtime.preflight
    artifacts:
      - path: preflight.json
        publisher: artifacts.manifest_publisher
        source:
          expression: "$.steps.preflight"
        format: json

  - id: workspace
    type: built_in
    uses: runtime.prepare_worktree
    artifacts:
      - path: workspace.json
        publisher: artifacts.manifest_publisher
        source:
          expression: "$.steps.workspace"
        format: json
    after:
      - preflight

  - id: repo_context
    type: built_in
    uses: runtime.collect_repo_context
    artifacts:
      - path: repo-context.json
        publisher: artifacts.manifest_publisher
        source:
          expression: "$.steps.repo_context"
        format: json
    after:
      - workspace

  - id: context
    type: built_in
    uses: context.collect_context
    input:
      agents:
        - review-planner
        - change-reviewer
        - change-acceptance-reviewer
    artifacts:
      - path: context-intake.json
        publisher: artifacts.manifest_publisher
        source:
          expression: "$.steps.context"
        format: json
    after:
      - workspace

  - id: review_plan
    type: agent
    agent: review-planner
    output_schema: output.schema.json
    artifacts:
      - path: review-plan.json
        publisher: artifacts.manifest_publisher
        source:
          expression: "$.steps.review_plan"
        format: json
    input:
      invocation:
        expression: "$.invocation"
      context:
        expression: "$.steps.context"
      repo_context:
        expression: "$.steps.repo_context"
    after:
      - context
      - repo_context

  - id: code_review
    type: agent
    agent: change-reviewer
    output_schema: output.schema.json
    artifacts:
      - path: raw-code-review-findings.json
        publisher: artifacts.manifest_publisher
        source:
          expression: "$.steps.code_review"
        format: json
    input:
      invocation:
        expression: "$.invocation"
      context:
        expression: "$.steps.context"
      review_plan:
        expression: "$.steps.review_plan"
      repo_context:
        expression: "$.steps.repo_context"
    after:
      - review_plan

  - id: acceptance
    type: agent
    agent: change-acceptance-reviewer
    output_schema: output.schema.json
    artifacts:
      - path: acceptance-review.json
        publisher: artifacts.manifest_publisher
        source:
          expression: "$.steps.acceptance"
        format: json
    input:
      invocation:
        expression: "$.invocation"
      context:
        expression: "$.steps.context"
      review_plan:
        expression: "$.steps.review_plan"
      findings:
        expression: "$.steps.code_review"
      repo_context:
        expression: "$.steps.repo_context"
    after:
      - code_review

  - id: final_report
    type: built_in
    uses: reports.final_report
    artifacts:
      - path: final-report.json
        publisher: artifacts.manifest_publisher
        source:
          expression: "$.steps.final_report"
        format: json
      - path: final-report.md
        publisher: artifacts.manifest_publisher
        source:
          expression: "$.steps.final_report.report"
        format: markdown
    input:
      title: Code Review
      sections:
        - heading: Findings
          content:
            expression: "$.steps.code_review"
        - heading: Acceptance
          content:
            expression: "$.steps.acceptance"
    after:
      - acceptance
