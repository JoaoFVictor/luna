nodes:
  - id: preflight
    type: built_in
    uses: preflight
    artifacts:
      - path: preflight.json
        source: $.steps.preflight
        format: json

  - id: workspace
    type: built_in
    uses: prepare_implementation_worktree
    artifacts:
      - path: workspace.json
        source: $.steps.workspace
        format: json
    after:
      - preflight

  - id: task_context
    type: built_in
    uses: collect_task_context
    artifacts:
      - path: task-context.json
        source: $.steps.task_context
        format: json
    after:
      - workspace

  - id: implementation_plan
    type: agent
    agent: implementation-planner
    output_schema: implementation_plan
    artifacts:
      - path: implementation-plan.json
        source: $.steps.implementation_plan
        format: json
    input:
      invocation: $.invocation
      task_context: $.steps.task_context
    after:
      - task_context

  - id: implementation
    type: agent_loop
    agent: code-implementer
    output_schema: implementation_result
    artifacts:
      - path: implementation-attempts.json
        source: $.steps.implementation.attempts
        format: json
      - path: validation.json
        source: $.steps.implementation.validation
        format: json
      - path: implementation-result.json
        source: $.steps.implementation.result
        format: json
    input:
      invocation: $.invocation
      task_context: $.steps.task_context
      implementation_plan: $.steps.implementation_plan
      workspace: $.workspace
    sandbox:
      type: trusted_host_local
      cwd: $.workspace.path
      env_allowlist: []
    validation:
      commands: $.config.implementation.validation.commands
      max_output_bytes: $.config.implementation.validation.max_output_bytes
    repair:
      attempts: $.config.implementation.validation.repair_attempts
    after:
      - implementation_plan

  - id: worktree_diff
    type: built_in
    uses: collect_worktree_diff
    artifacts:
      - path: worktree-diff.json
        source: $.steps.worktree_diff
        format: json
    after:
      - implementation

  - id: implementation_review
    type: agent
    agent: change-reviewer
    output_schema: implementation_review
    artifacts:
      - path: implementation-review.json
        source: $.steps.implementation_review
        format: json
    input:
      invocation: $.invocation
      task_context: $.steps.task_context
      implementation_result: $.steps.implementation
      worktree_diff: $.steps.worktree_diff
    after:
      - worktree_diff

  - id: acceptance
    type: agent
    agent: change-acceptance-reviewer
    output_schema: acceptance_decision
    artifacts:
      - path: acceptance-review.json
        source: $.steps.acceptance
        format: json
    input:
      invocation: $.invocation
      task_context: $.steps.task_context
      implementation_result: $.steps.implementation
      review: $.steps.implementation_review
    after:
      - implementation_review

  - id: commit
    type: built_in
    uses: commit_changes
    artifacts:
      - path: commit.json
        source: $.steps.commit
        format: json
    after:
      - acceptance

  - id: push
    type: built_in
    uses: push_branch
    artifacts:
      - path: push.json
        source: $.steps.push
        format: json
    after:
      - commit

  - id: pull_request
    type: built_in
    uses: open_pull_request
    artifacts:
      - path: pull-request.json
        source: $.steps.pull_request
        format: json
    after:
      - push

  - id: final_report
    type: built_in
    uses: final_implementation_report
    artifacts:
      - path: final-report.json
        source: $.steps.final_report.json
        format: json
      - path: final-report.md
        source: $.steps.final_report.markdown
        format: markdown
    after:
      - pull_request
