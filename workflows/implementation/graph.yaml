nodes:
  - id: preflight
    type: built_in
    uses: preflight
    artifacts:
      - path: preflight.json
        source: $.steps.preflight
        format: json

  - id: task_context
    type: built_in
    uses: collect_task_context
    artifacts:
      - path: task-context.json
        source: $.steps.task_context
        format: json
    after:
      - preflight

  - id: workspace
    type: built_in
    uses: prepare_implementation_worktree
    input:
      subject: $.steps.task_context.implementation_subject
    artifacts:
      - path: workspace.json
        source: $.steps.workspace
        format: json
    after:
      - task_context

  - id: context
    type: built_in
    uses: collect_context
    artifacts:
      - path: context-intake.json
        source: $.steps.context
        format: json
    input:
      agents:
        - implementation-planner
        - code-implementer
        - change-reviewer
        - change-acceptance-reviewer
    after:
      - workspace

  - id: implementation_plan
    type: agent
    agent: implementation-planner
    output_schema: implementation_plan
    artifacts:
      - path: implementation-plan.json
        source: $.steps.implementation_plan
        format: json
    input:
      invocation: $.invocation
      task_context: $.steps.task_context
      context: $.steps.context
    after:
      - task_context
      - context

  - id: implementation
    type: gated_agent_loop
    agent: code-implementer
    output_schema: implementation_result
    artifacts:
      - path: implementation-attempts.json
        source: $.steps.implementation.attempts
        format: json
      - path: validation.json
        source: $.steps.implementation.validation
        format: json
      - path: implementation-review.json
        source: $.steps.implementation.result.review
        format: json
      - path: acceptance-review.json
        source: $.steps.implementation.result.acceptance
        format: json
      - path: implementation-result.json
        source: $.steps.implementation.result
        format: json
    input:
      invocation: $.invocation
      task_context: $.steps.task_context
      context: $.steps.context
      implementation_plan: $.steps.implementation_plan
      workspace: $.workspace
    sandbox:
      type: trusted_host_local
      cwd: $.workspace.path
      env_allowlist: []
    gates:
      - id: validation
        type: validation_commands
        commands: $.config.implementation.validation.commands
        max_output_bytes: $.config.implementation.validation.max_output_bytes
      - id: review
        type: agent
        agent: change-reviewer
        block_when:
          expression: "$count(findings) > 0"
        feedback:
          expression: "findings"
        input:
          invocation: $.invocation
          task_context: $.steps.task_context
          context: $.steps.context
          implementation_plan: $.steps.implementation_plan
      - id: acceptance
        type: agent
        agent: change-acceptance-reviewer
        block_when:
          expression: "status != 'accepted'"
        feedback:
          expression: "{ 'status': status, 'blocking_reasons': blocking_reasons }"
        input:
          invocation: $.invocation
          task_context: $.steps.task_context
          context: $.steps.context
          implementation_plan: $.steps.implementation_plan
    repair:
      attempts: $.config.implementation.validation.repair_attempts
    after:
      - implementation_plan

  - id: implementation_validation
    type: built_in
    uses: record_implementation_validation
    input:
      implementation: $.steps.implementation
    artifacts:
      - path: implementation-validation.json
        source: $.steps.implementation_validation.validation
        format: json
    after:
      - implementation

  - id: commit
    type: built_in
    uses: commit_changes
    input:
      message: $.steps.task_context.implementation_title
      validation: $.steps.implementation_validation.validation
      acceptance: $.steps.implementation.result.acceptance
      diff: $.steps.implementation.result.diff_summary
    artifacts:
      - path: commit.json
        source: $.steps.commit
        format: json
    after:
      - implementation_validation

  - id: push
    type: built_in
    uses: push_branch
    artifacts:
      - path: push.json
        source: $.steps.push
        format: json
    after:
      - commit

  - id: change_request
    type: built_in
    uses: open_change_request
    input:
      push: $.steps.push
      title: $.steps.task_context.implementation_title
      body: $.steps.task_context.change_request_body
    artifacts:
      - path: change-request.json
        source: $.steps.change_request
        format: json
    after:
      - push

  - id: final_report
    type: built_in
    uses: final_implementation_report
    artifacts:
      - path: final-report.json
        source: $.steps.final_report.json
        format: json
      - path: final-report.md
        source: $.steps.final_report.markdown
        format: markdown
    after:
      - change_request
