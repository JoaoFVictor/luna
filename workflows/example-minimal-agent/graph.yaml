nodes:
  - id: preflight
    type: built_in
    uses: preflight
    artifacts:
      - path: preflight.json
        source: $.steps.preflight
        format: json

  - id: workspace
    type: built_in
    uses: prepare_worktree
    artifacts:
      - path: workspace.json
        source: $.steps.workspace
        format: json
    after:
      - preflight

  - id: context
    type: built_in
    uses: collect_context
    artifacts:
      - path: context-intake.json
        source: $.steps.context
        format: json
    input:
      agents:
        - example-minimal-agent
    after:
      - workspace

  - id: example_summary
    type: agent
    agent: example-minimal-agent
    output_schema: example_minimal_agent_result
    artifacts:
      - path: example-summary.json
        source: $.steps.example_summary
        format: json
      - path: example-summary.md
        source: $.steps.example_summary.summary
        format: markdown
    input:
      invocation: $.invocation
      repository: $.repository
      run: $.run
      context: $.steps.context
      goal: Demonstrate the smallest read-only Luna workflow shape.
    after:
      - context
