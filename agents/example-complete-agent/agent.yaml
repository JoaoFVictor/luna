id: example-complete-agent
description: Example agent that demonstrates every currently runnable Luna agent configuration field.
model_profile: balanced
mode: trusted_local_write
instructions_file: instructions.md
output_schema: output.schema.json
context:
  files:
    - context.md
skills:
  - ../../skills/luna-project-map/SKILL.md
  - ../../skills/luna-review-change/SKILL.md
tools:
  - repository.status
  - repository.diff-summary
# Optional MCP server ids from config/mcp.yaml.
# mcp_servers:
#   - example-mcp
subagents:
  - change-reviewer
  - id: change-acceptance-reviewer
    policy:
      mode: read_only
      # allow_tools is only valid when mode is trusted_local_write.
